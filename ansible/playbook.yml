---
- hosts: nexus_server
  become: yes
  vars:
    nexus_container_name: nexus
    nexus_docker_image: sonatype/nexus3
    nexus_port: 8081
    nexus_data_dir: /nexus-data
    nexus_repo_name: docker-hosted
    nexus_ci_user: github-user
    # CORRECTED: The lookup function now uses double quotes.
    nexus_ci_user_password: "{{ lookup('env', 'NEXUS_CI_USER_PASSWORD') }}"
    nexus_new_admin_password: "{{ lookup('env', 'NEXUS_ADMIN_PASSWORD') }}"

  tasks:
    - name: Clean dnf cache
      ansible.builtin.command:
        cmd: dnf clean all

    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Start and enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    - name: Create a directory for Nexus data
      file:
        path: "{{ nexus_data_dir }}"
        state: directory
        mode: '0777'

    # ... the rest of your tasks ...
    - name: Create a directory for Nexus data
      file:
        path: "{{ nexus_data_dir }}"
        state: directory
        mode: '0777'

    - name: Run Nexus Docker container
      docker_container:
        name: "{{ nexus_container_name }}"
        image: "{{ nexus_docker_image }}"
        state: started
        ports:
          - "{{ nexus_port }}:8081"
        volumes:
          - "{{ nexus_data_dir }}:/nexus-data"
        restart_policy: always

        - name: Wait for Nexus to start
      uri:
        url: "http://localhost:{{ nexus_port }}"
        method: GET
        status_code: 200
      register: result
      until: result.status == 200
      retries: 20 # Increased from 60
      delay: 30  # Increased from 10 to 30 seconds

    - name: Get Nexus logs on failure
      when: result is failed
      command: docker logs nexus

    - name: Read the default admin password
      slurp:
        src: "{{ nexus_data_dir }}/admin.password"
      register: default_admin_password

    - name: Decode the default admin password
      set_fact:
        nexus_default_password: "{{ default_admin_password.content | b64decode }}"

    - name: Change the default admin password
      uri:
        url: "http://localhost:{{ nexus_port }}/service/rest/v1/security/users/admin/change-password"
        method: PUT
        user: "admin"
        password: "{{ nexus_default_password }}"
        body: |
          {
            "userId": "admin",
            "newPassword": "{{ nexus_new_admin_password }}"
          }
        body_format: json
        headers:
          Content-Type: "application/json"
        status_code: 204

    - name: Create a new CI/CD user
      uri:
        url: "http://localhost:{{ nexus_port }}/service/rest/v1/security/users"
        method: POST
        user: "admin"
        password: "{{ nexus_new_admin_password }}"
        body: |
          {
            "userId": "{{ nexus_ci_user }}",
            "firstName": "CI",
            "lastName": "User",
            "emailAddress": "ci@example.com",
            "password": "{{ nexus_ci_user_password }}",
            "status": "active",
            "roles": ["nx-admin"]
          }
        body_format: json
        headers:
          Content-Type: "application/json"
        status_code: 200

    - name: Create a Docker hosted repository
      uri:
        url: "http://localhost:{{ nexus_port }}/service/rest/v1/repositories/docker/hosted"
        method: POST
        user: "admin"
        password: "{{ nexus_new_admin_password }}"
        body: |
          {
            "name": "{{ nexus_repo_name }}",
            "online": true,
            "storage": {
              "blobStoreName": "default",
              "strictContentTypeValidation": true,
              "writePolicy": "allow_once"
            },
            "docker": {
              "v1Enabled": false,
              "forceBasicAuth": true,
              "httpPort": 8082
            },
            "component": {
              "proprietaryComponents": true
            }
          }
        body_format: json
        headers:
          Content-Type: "application/json"
        status_code: 201